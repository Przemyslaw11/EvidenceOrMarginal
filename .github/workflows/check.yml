name: check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # check_numbers compares PREREGISTRATION.md with the freeze commit
      - uses: astral-sh/setup-uv@v10.3.3  # setup-uv publishes no moving major tag
        with:
          enable-cache: true
      - name: Install
        # the locked environment, then the CPU build of PyTorch (the PyPI build for Linux is the CUDA one)
        run: |
          uv sync --locked
          uv pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Lint
        run: |
          uv run --no-sync ruff check .
          uv run --no-sync ruff format --check .
      - name: Unit tests
        run: uv run --no-sync pytest
      - name: Numbers and tables
        working-directory: paper
        run: |
          uv run --no-sync python make_numbers.py
          uv run --no-sync python check_numbers.py
      - name: Fast validation tests on CPU
        run: uv run --no-sync densprop validate pre --device cpu --only M1,M2,M5,M6,M7,M8,M10 --out "$RUNNER_TEMP/test_results.json"
      - name: No tracked file changed
        run: git diff --exit-code

[project]
name = "evidence-or-marginal"
version = "1.0.0"
description = "Code of the paper Evidence or Marginal? What Moment-Vector Propagation Computes in Polynomial Density Neurons"
authors = [{ name = "Przemysław Spyra" }]
license = "Apache-2.0"
requires-python = ">=3.10"
# Lower bounds are the versions of the production runs (numpy, scipy, pandas, pyarrow, torch) or of the paper rebuild
# (mpmath, pyyaml); requirements-lock.txt records the production environment.
dependencies = [
    "numpy>=1.26.4",
    "scipy>=1.13.1",
    "mpmath>=1.3.0",
    "matplotlib",  # the paper figures were made with 3.11.2, which needs Python >= 3.11
    "pandas>=2.2.2",
    "pyarrow>=16.1.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# PyTorch is needed for the study, the tests and four post hoc scripts, not to rebuild the paper from stored results. From PyPI
# it is the CPU build on macOS and the CUDA build on Linux, which the cluster needs; CI installs the CPU wheel instead.
torch = ["torch>=2.4.0"]
gpu = ["torch>=2.4.0", "nvidia-ml-py"]  # NVML for the energy benchmark

[project.scripts]
densprop = "densprop.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.13"]

[build-system]
requires = ["uv_build>=0.8.19,<0.10"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "densprop"

[tool.uv]
# The versions that rebuilt the paper's outputs byte for byte (Python 3.13, macOS); the lock keeps them.
constraint-dependencies = [
    "numpy==2.5.4; python_version >= '3.13'",
    "scipy==1.18.1; python_version >= '3.13'",
    "pandas==3.1.0; python_version >= '3.13'",
    "pyarrow==26.0.0; python_version >= '3.13'",
    "matplotlib==3.11.2; python_version >= '3.13'",
    "mpmath==1.3.0",
    "pyyaml==6.0.3",
    "torch==2.14.1; python_version >= '3.13'",
]

[tool.ruff]
line-length = 150  # the code base was written to about 150 columns; the formatter then rewraps only the outliers
target-version = "py310"  # the production cluster runs Python 3.10

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "N", "RUF", "PT", "C4", "PIE", "NPY", "PLE", "PLW"]
ignore = [
    "N802",    # test functions are named M1-M14, as in the paper
    "N803",    # arguments follow the paper's notation (R, M, V, D)
    "N806",    # so do local variables
    "N812",    # short module aliases (C for copulas, F for figures) read like the formulas
    "N816",    # globals in the paper's notation (FX, Lg)
    "E731",    # one-line local formulas are clearer as lambdas
    "E741",    # l is the layer index, as in the paper
    "B023",    # loop closures are called within the iteration that defines them
    "B905",    # zip(strict=) would add noise: the zipped sequences have equal length by construction
    "C408",    # dict(key=value) is the house style for records
    "RUF001",  # typographic characters (en dash, times, rho, micro) in report text are intended
    "RUF002",  # the same in docstrings
    "RUF005",  # list concatenation reads like the formula it implements
    "SIM108",  # if-else blocks around long numeric expressions read better than ternaries
    "SIM300",  # upper-case names are matrices in the paper's notation (D, A0), not constants: no yoda reordering
]

[tool.ruff.lint.per-file-ignores]
"!tests/**" = ["PT"]  # pytest style rules apply to the pytest tests only
"three_input_study/tests/run_tests.py" = ["E402"]  # the self-contained study puts its src/ on sys.path before importing it
"three_input_study/src/report.py" = ["E501"]  # report prose: each long line is one paragraph of the generated text
"paper/make_numbers.py" = ["E501"]  # LaTeX table headers: one header row per line, as in the rendered table
